<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISMS Typing Race</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap">
<style>
/* Layout: an exam answer booklet. Library = chapter index + "levels"; Play = one ruled answer sheet with a stats strip. */
:root{
  --paper:#eef0ea;      /* booklet paper, faint green-grey */
  --sheet:#fbfbf7;      /* answer sheet */
  --ink:#23262b;        /* typed ink */
  --muted:#7b8078;      /* untyped / guide text */
  --rule:#d5dbe3;       /* ruled lines */
  --margin:#e7a9a4;     /* margin line */
  --pen:#1d3fb8;        /* ballpoint blue: accent */
  --pen-soft:#dfe5f8;
  --err:#c4271f;
  --err-bg:#f7d6d3;
  --ok:#2f6b3a;
  --line:#cfd3cb;
  --f-display:"Special Elite","Courier New",ui-monospace,monospace;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161b;--sheet:#1c1f26;--ink:#e3e5df;--muted:#6f7480;--rule:#2a2f39;--margin:#6a3a3a;
  --pen:#8ea6ff;--pen-soft:#263157;--err:#ff7b70;--err-bg:#4a2422;--ok:#7fc58a;--line:#2e333d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14161b;--sheet:#1c1f26;--ink:#e3e5df;--muted:#6f7480;--rule:#2a2f39;--margin:#6a3a3a;
  --pen:#8ea6ff;--pen-soft:#263157;--err:#ff7b70;--err-bg:#4a2422;--ok:#7fc58a;--line:#2e333d;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-type);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.02em;background:none;border:0;padding:0;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-type);font-size:.75rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1}
.chip{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--err);border-color:var(--err)}
.iconbtn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:.85rem}
.iconbtn:hover{border-color:var(--pen)}

/* library */
.lib{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-block:24px 60px}
.chapters{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.chapters h2,.levels h2{font-family:var(--f-display);font-weight:400;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ch{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:baseline;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:7px 8px;border-radius:0 6px 6px 0;font-size:.88rem;line-height:1.3}
.ch:hover{background:var(--sheet)}
.ch[aria-current="true"]{border-left-color:var(--pen);background:var(--sheet);color:var(--pen)}
.ch .n{color:var(--muted);font-variant-numeric:tabular-nums}
.ch .c{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.levels{min-width:0}
.lvhead{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:18px}
.lvhead h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.15;margin:0;text-wrap:balance;flex:1 1 320px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:.82rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px;position:relative;min-height:150px;
  background-image:linear-gradient(90deg,transparent 0 22px,var(--margin) 22px 23px,transparent 23px)}
.card{padding-left:36px}
.card:hover{border-color:var(--pen);transform:translateY(-1px)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{border:1px solid currentColor;border-radius:3px;padding:0 5px}
.tag.q{color:var(--pen)} .tag.d{color:var(--ok)} .tag.lp{color:var(--err)}
.card h3{font-family:var(--f-type);font-weight:700;font-size:1rem;line-height:1.3;margin:0;text-wrap:balance}
.card p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .foot b{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:4px;padding:28px;color:var(--muted);font-size:.9rem;grid-column:1/-1}

/* play */
.play{padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.crumbs button{background:none;border:0;padding:0;color:var(--pen);text-transform:uppercase;letter-spacing:.06em}
.ptitle{font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,3vw,2rem);line-height:1.2;margin:0;text-wrap:balance}
.prompt{border-left:3px solid var(--pen);padding:6px 0 6px 14px;font-style:italic;max-width:75ch}
.prompt b{font-style:normal;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pen);display:block}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 12px;font-size:.84rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.stats{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));border:1px solid var(--line);background:var(--sheet);border-radius:4px}
.stat{padding:8px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;font-weight:700}
.stat b.big{color:var(--pen)}

.sheetwrap{position:relative}
.sheet{--lh:2.1rem;position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:3px;
  padding:calc(var(--lh)*.55) 22px calc(var(--lh)*1) 64px;max-height:min(58vh,560px);overflow-y:auto;cursor:text;
  font-size:1.18rem;line-height:var(--lh);white-space:pre-wrap;word-break:break-word;
  background-image:linear-gradient(90deg,transparent 0 46px,var(--margin) 46px 47px,transparent 47px),
    repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px) var(--lh));
  background-attachment:local;background-position:0 calc(var(--lh)*.55 + 4px)}
.sheet{color:var(--muted)}
#stage{display:flex;flex-direction:column;gap:14px}
.sheet span{position:relative}
.sheet .ok{color:var(--ink)}
.sheet .bad{color:var(--err);background:var(--err-bg);border-radius:2px}
.sheet .nl{color:var(--muted);opacity:.45;font-size:.8em}
.sheet .nl.ok{opacity:.3}
.sheet .nl.bad{opacity:1}
.sheet .sp.cur::after{content:"·";position:absolute;left:0;right:0;text-align:center;color:var(--pen);opacity:.6}
.sheet .cur{box-shadow:inset 2px 0 0 var(--pen);animation:blink 1.05s steps(1) infinite}
.sheet.typing .cur{animation:none}
.sheet .hid{color:transparent;text-shadow:0 0 8px var(--muted)}
.sheet .hid.nl{text-shadow:none;color:var(--muted)}
@keyframes blink{50%{box-shadow:inset 2px 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.sheet .cur{animation:none}.card:hover{transform:none}}
.focusnote{position:absolute;right:10px;bottom:10px;background:var(--pen-soft);color:var(--pen);border:1px solid var(--pen);border-radius:999px;padding:2px 12px;font-size:.78rem;pointer-events:none}
.hint{font-size:.78rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
kbd{font-family:var(--f-type);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.75rem;background:var(--sheet);color:var(--ink)}
#cap{position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px}

/* results */
.result{background:var(--sheet);border:1px solid var(--ink);border-radius:4px;padding:20px 22px;display:grid;gap:14px}
.result h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:1.4rem}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.rgrid div{border-top:1px solid var(--line);padding-top:6px}
.rgrid span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rgrid b{font-size:1.7rem;font-variant-numeric:tabular-nums}
.rgrid b.pb{color:var(--pen)}
.stamp{font-family:var(--f-display);color:var(--err);border:2px solid var(--err);display:inline-block;padding:2px 10px;transform:rotate(-4deg);font-size:.9rem;letter-spacing:.1em}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--sheet);border-radius:6px;padding:8px 16px;font-size:.92rem}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn:hover{border-color:var(--pen)}

/* nav */
.tabs{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--sheet)}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:6px;font-size:.9rem}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--sheet)}
/* reader */
.reader{min-width:0;display:flex;flex-direction:column;gap:28px;max-width:78ch}
.brief{background:var(--sheet);border:1px solid var(--ink);border-radius:3px;padding:18px 22px}
.brief h1{font-family:var(--f-display);font-weight:400;margin:0;font-size:1.6rem}
.brief .sub{margin:4px 0 10px;color:var(--muted);font-size:.85rem}
.brief h3{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pen);margin:16px 0 6px}
.brief ol{margin:0;padding-left:28px;display:grid;gap:4px;font-size:.95rem}
.brief li.missing{color:var(--muted);font-style:italic}
.brief a.covered{color:var(--ok);font-size:.8rem;text-decoration:none;border-bottom:1px dotted var(--ok);margin-left:4px}
.rch h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0 0 12px;display:flex;flex-direction:column}
.rch h2 span{font-family:var(--f-type);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rentry{border-top:1px solid var(--line);padding:16px 0 20px;display:grid;gap:10px;scroll-margin-top:80px;min-width:0}
.rentry .meta{display:flex;gap:6px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.rentry h3{margin:0;font-size:1.12rem}
.rentry .body p{margin:0 0 .6em} .rentry .body ul,.rentry .body ol{margin:0 0 .6em;padding-left:24px}
/* source slides */
.reader.wide{max-width:none}
.reader>.track{align-self:flex-start}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.deck{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 8px 10px;font-size:.88rem;line-height:1.3}
.deck:hover{border-color:var(--pen)}
.deck img{width:100%;height:auto;aspect-ratio:1280/906;object-fit:cover;border-radius:2px;background:var(--line)}
.deck .dk{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pen);margin-top:4px}
.deckview{display:flex;flex-direction:column;gap:18px;margin-bottom:28px}
.dvh{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0;display:flex;flex-direction:column}
.dvh span{font-family:var(--f-type);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dvh small{font-family:var(--f-type);font-size:.78rem;color:var(--muted)}
.slide{margin:0;display:flex;flex-direction:column;gap:4px;max-width:960px}
.slidebtn{padding:0;border:1px solid var(--line);background:var(--line);border-radius:3px;cursor:zoom-in;line-height:0;box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.slidebtn img{width:100%;height:auto;display:block;border-radius:2px}
.slide figcaption{font-size:.72rem;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,9,11,.97);display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lbbar{display:flex;gap:8px;align-items:center;color:#e8e8e8;font-size:.85rem;flex-wrap:wrap}
.lbbar .iconbtn{background:#222;color:#eee;border-color:#444}
.lbbar .iconbtn:disabled{opacity:.4}
.lbimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:10px;cursor:zoom-out}
.lbimg img{max-width:100%;max-height:100%;object-fit:contain;cursor:default}
/* quiz setup */
.qsetup{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.qblock h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:400}
.qblock h3 small{text-transform:none;letter-spacing:0;margin-left:8px;color:var(--pen)}
.qblock.row{display:flex;gap:24px;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:.78em;margin-left:4px}
.filters button[aria-pressed="true"] .cnt{color:inherit;opacity:.7}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.topic{display:flex;gap:10px;align-items:baseline;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:.9rem}
.topic:has(input:checked){border-color:var(--pen)}
.topic input{accent-color:var(--pen)}
.topic .cnt{margin-left:auto;white-space:nowrap}
.qbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qbar span{display:block;height:100%;background:var(--pen)}
.why.bad{border-left-color:var(--err)}
.missed h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0 0 8px}
.mq{border-top:1px solid var(--line);padding:8px 0}
.mq p{margin:0} .mq .ans{color:var(--ok);font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
@media (max-width:760px){.tabs{order:3;width:100%}.tabs button{flex:1}}
/* quiz */
.quiz{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:20px 22px;display:grid;gap:16px;max-width:760px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.quiz h2{font-family:var(--f-type);font-weight:700;font-size:1.15rem;line-height:1.4;margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:.98rem;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt .ol{font-family:var(--f-display);color:var(--muted)}
.opt.no{border-color:var(--err);color:var(--err);background:var(--err-bg);text-decoration:line-through;animation:shake .3s}
.opt.yes{border-color:var(--ok);color:var(--ok);font-weight:700;box-shadow:inset 3px 0 0 var(--ok)}
.opt:disabled{cursor:default}
.opt:disabled:not(.yes):not(.no){opacity:.55}
.why{font-size:.92rem;border-left:3px solid var(--ok);padding-left:12px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.opt.no{animation:none}}
/* exam paper */
.exampaper{border:1px solid var(--ink);background:var(--sheet);border-radius:3px;padding:14px 18px;display:grid;gap:8px}
.exampaper .eh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.exampaper .eq{font-weight:700;font-size:1.08rem;line-height:1.45}
.exampaper .eq .qn{font-family:var(--f-display);font-weight:400;color:var(--pen);margin-right:8px}
.rules{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.rules span::before{content:"✓ ";color:var(--ok)}
.anslabel{font-family:var(--f-display);font-size:.8rem;letter-spacing:.14em;color:var(--muted);margin-bottom:-8px}
.track{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.track button{border:0;background:var(--sheet);padding:7px 14px;font-size:.88rem}
.track button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* drawing */
.drawarea{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.drawarea.revealed{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.canvasbox{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:3px;height:min(60vh,460px);touch-action:none;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,color-mix(in srgb,var(--rule) 45%,transparent) 31px 32px)}
.canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.ref{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:10px;overflow-x:auto;display:flex;flex-direction:column;gap:6px}
.ref svg{width:100%;min-width:520px;height:auto;display:block}
.ref .lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.d-box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.d-ring{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
.d-box.alt{fill:var(--pen-soft)}
.d-txt{fill:var(--ink);font-family:var(--f-type);font-size:12px}
.d-head{fill:var(--pen);font-family:var(--f-display);font-size:13px;letter-spacing:.06em}
.d-arrow{stroke:var(--ink);stroke-width:1.5;fill:none}
.d-arrow.dash{stroke-dasharray:5 4;stroke:var(--err)}
.d-mark{fill:var(--ink)} .d-mark.red{fill:var(--err)}
.d-note{fill:var(--err);font-family:var(--f-type);font-size:11.5px;font-style:italic}

@media (max-width:760px){
  .lib{grid-template-columns:1fr;gap:16px}
  .chapters{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .chapters h2{display:none}
  .ch{grid-template-columns:auto auto;border:1px solid var(--line);border-radius:999px;white-space:nowrap;padding:5px 12px}
  .ch .t{display:none}
  .ch[aria-current="true"]{border-color:var(--pen)}
  .stat{padding:8px 10px}.stat b{font-size:1.2rem}
  .stats.four{--cols:2}.stats.four .stat:nth-child(3){border-left:0}.stats.four .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .sheet{padding-left:40px;padding-right:14px;font-size:1.02rem;--lh:1.9rem;
    background-image:linear-gradient(90deg,transparent 0 28px,var(--margin) 28px 29px,transparent 29px),
