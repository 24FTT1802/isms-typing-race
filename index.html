/* ======================= TYPING ======================= */
function startType(e){
  draw=null;
  $("#subcontrols").innerHTML=`<div class="seg" role="group" aria-label="Text visibility">
     <button data-m="see" aria-pressed="${ui.mode==="see"}" title="See the whole text">Copy</button>
     <button data-m="recall" aria-pressed="${ui.mode==="recall"}" title="Text is blurred: type it from memory">Recall</button></div>
     <button class="iconbtn" id="restart" title="Restart (Esc)">↺ Restart</button>`;
  $("#subcontrols").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ui.mode=b.dataset.m;store.set("mode",ui.mode);startType(e)});
  $("#restart").onclick=()=>startType(e);

  const text=e.text.replace(/\r/g,"");
  session={e,text,typed:[],pos:0,start:0,end:0,keys:0,correctKeys:0,errors:0,peeks:0,peekTo:-1,done:false};
  const stage=$("#stage");
  stage.innerHTML=`
    <div class="stats" aria-live="off">
      <div class="stat"><span>Time</span><b id="sTime">0:00</b></div>
      <div class="stat"><span>WPM</span><b id="sWpm" class="big">0</b></div>
      <div class="stat"><span>Accuracy</span><b id="sAcc">100%</b></div>
    </div>
    ${ui.track==="exam"?`<div class="anslabel">ANSWER · ${text.trim().split(/\s+/).length} words</div>`:""}
    <div class="sheetwrap"><div class="sheet" id="sheet"></div><div class="focusnote" id="focusnote" hidden>Click here, then type</div></div>
    <div class="hint"><span><kbd>Enter</kbd> new line (↵)</span><span><kbd>-</kbd> or <kbd>*</kbd> for •</span><span><kbd>Esc</kbd> restart</span>${ui.mode==="recall"?`<span><kbd>Tab</kbd> peek next word</span>`:""}<span>Timer starts on your first key</span></div>
    <div id="resultBox"></div>`;
  const sheet=$("#sheet");
  const frag=document.createDocumentFragment();
  session.spans=[...text].map((c,i)=>{
    const s=document.createElement("span");
    if(c==="\n"){s.className="nl";s.textContent="↵";frag.appendChild(s);frag.appendChild(document.createTextNode("\n"));}
    else{ if(c===" ") s.classList.add("sp"); s.textContent=c; frag.appendChild(s);}
    return s;
  });
  sheet.appendChild(frag);
  session.spans.forEach((_,i)=>paint(i));
  sheet.onclick=()=>focusCap();
  focusCap();
}
function paint(i){
  const s=session.spans[i]; if(!s) return;
  const t=session.typed[i], c=session.text[i];
  s.classList.toggle("ok", t!==undefined && same(t,c));
  s.classList.toggle("bad", t!==undefined && !same(t,c));
  s.classList.toggle("cur", i===session.pos && !session.done);
  s.classList.toggle("hid", ui.mode==="recall" && !session.done && i>=session.pos && i>session.peekTo);
}
function wordEnd(from){const t=session.text;let j=from;while(j<t.length&&t[j]===" ")j++;while(j<t.length&&!/\s/.test(t[j]))j++;return j-1;}
function focusCap(){ if(ui.view!=="play"||ui.tab!=="type"||!session||session.done) return; cap.value="  "; cap.focus({preventScroll:true}); setTimeout(updFocusNote,0); }
function updFocusNote(){const n=$("#focusnote"); if(n) n.hidden = document.activeElement===cap || !session || session.done || !!session.start;}
cap.addEventListener("blur",()=>setTimeout(updFocusNote,0));
cap.addEventListener("focus",updFocusNote);

function typeChar(ch){
  const S=session; if(!S||S.done) return;
  const fn=$("#focusnote"); if(fn) fn.hidden=true;
  if(!S.start){S.start=performance.now(); startTick(); $("#sheet").classList.add("typing");}
  const i=S.pos; if(i>=S.text.length) return;
  S.typed[i]=ch; S.keys++;
  const ok=same(ch,S.text[i]);
  if(ok) S.correctKeys++; else S.errors++;
  S.pos++;
  // auto-indent: after a correct newline, skip leading spaces
  if(ok && S.text[i]==="\n"){ while(S.text[S.pos]===" "){S.typed[S.pos]=" ";paint(S.pos);S.pos++;} }
  paint(i); paint(S.pos);
  for(let k=i+1;k<S.pos;k++) paint(k);
  scrollToCursor(); updStats();
  if(S.pos>=S.text.length) finish();
}
function backspace(word){
  const S=session; if(!S||S.done||S.pos===0) return;
  const old=S.pos;
  if(word){ let j=S.pos-1; while(j>0&&/\s/.test(S.text[j]))j--; while(j>0&&!/\s/.test(S.text[j-1]))j--; S.pos=j; }
  else { S.pos--; while(S.pos>0 && S.text[S.pos]===" " && S.text[S.pos-1]===" " && S.typed[S.pos]===" " && isIndent(S.pos)) S.pos--; }
  for(let k=S.pos;k<old;k++){ S.typed[k]=undefined; }
  for(let k=S.pos;k<=old;k++) paint(k);
  scrollToCursor(); updStats();
}
function isIndent(i){let j=i;while(j>0&&session.text[j-1]===" ")j--;return j===0||session.text[j-1]==="\n";}
function peek(){
  const S=session; if(!S||S.done||ui.mode!=="recall") return;
  const old=S.peekTo; S.peekTo=Math.max(S.peekTo,wordEnd(S.pos)); S.peeks++;
  for(let k=Math.max(S.pos,old+1);k<=S.peekTo;k++) paint(k);
}
function scrollToCursor(){
  const sheet=$("#sheet"), s=session.spans[Math.min(session.pos,session.spans.length-1)]; if(!sheet||!s) return;
  const top=s.offsetTop, h=sheet.clientHeight;
  if(top>sheet.scrollTop+h*0.6) sheet.scrollTop=top-h*0.35;
  else if(top<sheet.scrollTop+20) sheet.scrollTop=Math.max(0,top-h*0.3);
}
function metrics(){
  const S=session, now=S.end||performance.now(), secs=S.start?(now-S.start)/1000:0;
  let correct=0; for(let i=0;i<S.pos;i++) if(S.typed[i]!==undefined&&same(S.typed[i],S.text[i])) correct++;
  const mins=Math.max(secs,1)/60;
  return {secs, wpm:Math.round((correct/5)/mins), raw:Math.round((S.pos/5)/mins),
    acc:S.keys?Math.round(S.correctKeys/S.keys*100):100, prog:Math.round(S.pos/S.text.length*100)};
}
function updStats(){
  if(!session||!$("#sTime")) return; const m=metrics();
  $("#sTime").textContent=fmtTime(m.secs); $("#sWpm").textContent=session.start?m.wpm:0;
  $("#sAcc").textContent=m.acc+"%";
}
function startTick(){stopTick();tick=setInterval(updStats,250)}
function stopTick(){if(tick)clearInterval(tick);tick=null}

function finish(){
  const S=session; S.done=true; S.end=performance.now(); stopTick(); updStats(); cap.blur();
  S.spans.forEach((_,i)=>paint(i)); $("#sheet").classList.remove("typing"); $("#focusnote").hidden=true;
  const m=metrics(), prev=records[S.e.id]||{};
  const pb=!prev.wpm||m.wpm>prev.wpm;
  records[S.e.id]={...prev, wpm:pb?m.wpm:prev.wpm, acc:pb?m.acc:prev.acc, time:pb?Math.round(m.secs):prev.time, runs:(prev.runs||0)+1};
  store.set("records",records);
  let wrongWords=0; S.text.split(/(\s+)/).reduce((p,w)=>{ if(w.trim()){for(let k=p;k<p+w.length;k++){if(!same(S.typed[k],S.text[k])){wrongWords++;break;}}} return p+w.length;},0);
  $("#resultBox").innerHTML=`<div class="result" role="status">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><h2>Sheet complete</h2>${pb?`<span class="stamp">${prev.wpm?"NEW BEST":"FIRST RUN"}</span>`:""}</div>
    <div class="rgrid">
      <div><span>WPM</span><b class="pb">${m.wpm}</b></div>
      <div><span>Accuracy</span><b>${m.acc}%</b></div>
      <div><span>Time</span><b>${fmtTime(m.secs)}</b></div>
      <div><span>Words missed</span><b>${wrongWords}</b></div>
      ${ui.mode==="recall"?`<div><span>Peeks</span><b>${S.peeks}</b></div>`:""}
      <div><span>Best</span><b>${records[S.e.id].wpm}</b></div>
    </div>
    <div class="actions"><button class="btn" id="rRetry">↺ Retype</button>
      ${S.e.diagram?`<button class="btn" id="rDraw">✎ Draw the diagram</button>`:""}
      <button class="btn primary" id="rNext">${S.e.quiz.length?"Next: quick quiz →":"Next sheet →"}</button></div></div>`;
  $("#rRetry").onclick=()=>startType(S.e);
  $("#rNext").onclick=()=>goNext(S.e,"type");
  if($("#rDraw")) $("#rDraw").onclick=()=>openEntry(S.e.id,"draw");
  $("#resultBox").scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* keyboard */
document.addEventListener("keydown",ev=>{
  if(ui.view!=="play"||ui.tab!=="type"||!session) return;
  if(session.done) return;
  if(ev.target!==cap && (ev.target.closest&&ev.target.closest("button"))&&(ev.key===" "||ev.key==="Enter")) return;
  if(ev.key==="Escape"){ev.preventDefault();startType(session.e);return}
  if(ev.metaKey||(ev.ctrlKey&&ev.key!=="Backspace")||ev.altKey&&ev.key.length>1) return;
  if(document.activeElement!==cap) focusCap();
  if(ev.key==="Backspace"){ev.preventDefault();backspace(ev.ctrlKey||ev.altKey);return}
  if(ev.key==="Enter"){ev.preventDefault();typeChar("\n");return}
  if(ev.key==="Tab"){ev.preventDefault();peek();return}
  if(ev.key.length===1){ev.preventDefault();typeChar(ev.key)}
});
/* mobile keyboards (keydown reports "Unidentified") */
cap.addEventListener("input",ev=>{
  if(!session||session.done) return;
  const t=ev.inputType;
  if(t==="deleteContentBackward") backspace(false);
  else if(t==="insertLineBreak"||t==="insertParagraph") typeChar("\n");
  else if(ev.data) [...ev.data].forEach(typeChar);
  cap.value="  ";
});

/* ======================= QUIZ GATE ======================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepQ(q){const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}
function goNext(e,tab){
  if(!e.quiz||!e.quiz.length) return openEntry(ui.nextId,tab);
  const n=ui.gateN==="all"?e.quiz.length:Math.min(+ui.gateN,e.quiz.length);
  ui.gate=shuffle(e.quiz).slice(0,n).map(prepQ); runQuiz(e,tab,0);
}
function runQuiz(e,tab,qi){
  const G=ui.gate;
  session=null; stopTick(); cap.blur();
  const q=G[qi], last=qi===G.length-1, sub=$("#subcontrols"); if(sub) sub.innerHTML="";
  ["#prev","#next"].forEach(s=>{const b=$(s); if(b) b.hidden=true;});
  app.querySelectorAll("[data-tab]").forEach(b=>b.disabled=true);
  let tries=0;
  $("#stage").innerHTML=`<div class="quiz">
    <div class="qhead"><span>Quick check · ${qi+1} of ${G.length}</span><span>Pick the right answer to continue</span></div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ol">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="why" id="why" hidden></div>
    <div class="actions" id="qAct" hidden><button class="btn primary" id="qGo">${last?"Next sheet →":"Next question →"}</button></div>
  </div>`;
  $("#stage").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; tries++;
    if(i!==q.a){ b.classList.add("no"); b.disabled=true; b.setAttribute("aria-label","Wrong: "+q.o[i]); return; }
    b.classList.add("yes");
    $("#stage").querySelectorAll(".opt").forEach(x=>x.disabled=true);
    const w=$("#why"); w.hidden=false; w.innerHTML=`<b>${tries===1?"Correct, first try.":"Correct."}</b> ${esc(q.why||"")}`;
    $("#qAct").hidden=false;
    $("#qGo").onclick=()=> last ? openEntry(ui.nextId,tab) : runQuiz(e,tab,qi+1);
  });
}

/* ======================= DRAWING ======================= */
function startDraw(e){
  session=null; cap.blur();
  const rec=records[e.id]||{};
  draw={e,strokes:[],color:"pen",size:3,erase:false,start:0,end:0,revealed:false};
  $("#subcontrols").innerHTML=`<div class="tools">
      <button class="swatch" data-c="pen" style="background:var(--pen)" aria-label="Blue pen" aria-pressed="true"></button>
      <button class="swatch" data-c="ink" style="background:var(--ink)" aria-label="Black pen" aria-pressed="false"></button>
      <button class="swatch" data-c="err" style="background:var(--err)" aria-label="Red pen" aria-pressed="false"></button>
      <div class="seg" role="group" aria-label="Tool"><button data-tool="thin" aria-pressed="false">Fine</button><button data-tool="med" aria-pressed="true">Medium</button><button data-tool="erase" aria-pressed="false">Eraser</button></div>
      <button class="iconbtn" id="undo">↶ Undo</button><button class="iconbtn" id="clear">Clear</button></div>`;
  $("#stage").innerHTML=`
    <div class="stats four" style="--cols:4"><div class="stat"><span>Time</span><b id="dTime">0:00</b></div><div class="stat"><span>Strokes</span><b id="dStrokes">0</b></div>
      <div class="stat"><span>Last result</span><b style="font-size:1rem">${rec.draw?esc(rec.draw):"–"}</b></div><div class="stat"><span>Rule</span><b style="font-size:.9rem;font-weight:400">Pen only in the exam</b></div></div>
    <div class="drawarea" id="drawarea">
      <div class="canvasbox" id="cbox"><canvas id="cv" aria-label="Drawing area"></canvas></div>
      <div class="ref" id="ref" hidden><span class="lbl">Reference diagram</span>${DIAGRAMS[e.diagram]()}</div>
    </div>
    <div class="actions" id="drawActions"><button class="btn primary" id="reveal">Done, compare with reference</button>
      <span class="hint" style="align-self:center">Draw from memory. The timer starts on your first stroke.</span></div>`;
  const cv=$("#cv"), ctx=cv.getContext("2d");
  const colorOf=k=>getComputedStyle(root).getPropertyValue("--"+k).trim()||"#1d3fb8";
  function size(){if(!draw||draw.e!==e||!cv.isConnected)return;const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);redraw();}
  function line(s){ if(s.pts.length<1) return;
    ctx.globalCompositeOperation=s.erase?"destination-out":"source-over";
    ctx.strokeStyle=colorOf(s.color); ctx.lineWidth=s.erase?22:s.size; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(s.pts[0][0],s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
    if(s.pts.length===1) ctx.lineTo(s.pts[0][0]+.1,s.pts[0][1]);
    ctx.stroke(); ctx.globalCompositeOperation="source-over"; }
  function redraw(){if(!draw||draw.e!==e)return;const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);draw.strokes.forEach(line);$("#dStrokes").textContent=draw.strokes.filter(s=>!s.erase).length;}
  draw.redraw=redraw;
  let cur=null;
  const pt=ev=>{const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top]};
  cv.onpointerdown=ev=>{ev.preventDefault();cv.setPointerCapture(ev.pointerId);
    if(!draw.start){draw.start=performance.now();stopTick();tick=setInterval(()=>{if(!draw||draw.end)return;const t=$("#dTime");if(t)t.textContent=fmtTime((performance.now()-draw.start)/1000)},250)}
    cur={pts:[pt(ev)],color:draw.color,size:draw.size,erase:draw.erase};draw.strokes.push(cur);redraw();};
  cv.onpointermove=ev=>{if(!cur)return;cur.pts.push(pt(ev));redraw();};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  new ResizeObserver(size).observe($("#cbox"));
  $("#subcontrols").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{draw.color=b.dataset.c;draw.erase=false;
    $("#subcontrols").querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#subcontrols").querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===(draw.size<3?"thin":"med")))});
  $("#subcontrols").querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{const t=b.dataset.tool;
    draw.erase=t==="erase"; if(!draw.erase) draw.size=t==="thin"?1.8:3;
    $("#subcontrols").querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#undo").onclick=()=>{draw.strokes.pop();redraw()};
  $("#clear").onclick=()=>{draw.strokes=[];redraw()};
  $("#reveal").onclick=()=>{
    draw.end=performance.now(); stopTick(); const secs=draw.start?(draw.end-draw.start)/1000:0;
    $("#ref").hidden=false; $("#drawarea").classList.add("revealed"); requestAnimationFrame(size);
    $("#drawActions").innerHTML=`<span class="hint" style="align-self:center">Time ${fmtTime(secs)}. How close was yours?</span>
      ${["Got it","Partly","Missed it"].map(r=>`<button class="btn" data-rate="${r}">${r}</button>`).join("")}
      <button class="btn" id="dRetry">↺ Redraw</button>
      ${e.text?`<button class="btn" id="dType">⌨ Type the answer</button>`:""}
      <button class="btn primary" id="dNext">${e.quiz.length?"Next: quick quiz →":"Next →"}</button>`;
    $("#drawActions").querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{
      records[e.id]={...(records[e.id]||{}),draw:`${b.dataset.rate} · ${fmtTime(secs)}`};store.set("records",records);
      $("#drawActions").querySelectorAll("[data-rate]").forEach(x=>x.classList.toggle("primary",x===b));});
    $("#dRetry").onclick=()=>startDraw(e);
    $("#dNext").onclick=()=>goNext(e,"draw");
    if($("#dType")) $("#dType").onclick=()=>openEntry(e.id,"type");
  };
}
/* redraw strokes when the theme flips so ink colours follow */
new MutationObserver(()=>draw&&draw.redraw&&draw.redraw()).observe(root,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw&&draw.redraw&&draw.redraw());

document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{const s=b.dataset.sec; s==="quiz"?renderQuizSetup():s==="read"?renderRead():renderLib();});
$("#home").onclick=renderLib;
(store.get("section","type")==="read"?renderRead:renderLib)();
</script>

</body></html>
