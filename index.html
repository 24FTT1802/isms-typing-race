/* ---------- CH 0 ---------- */
{id:"c0-isms",ch:0,kind:"note",title:"What is ISMS?",
text:`ISMS is a set of policies and procedures for systematically managing an organization's sensitive data. The goal is to minimize risk and ensure business keeps running smoothly. Security administration is a management issue, not a purely technical issue.
The three key resources in ISMS are:
• Information
• People
• Technology`},

/* ---------- CH 1 ---------- */
{id:"c1-mis-it",ch:1,kind:"question",title:"MIS and IT, and how they relate",
prompt:"Define MIS and IT, and describe their relationship.",
text:`Management information systems (MIS) deals with the planning for, development, management and use of information technology tools to help people perform all the tasks related to information processing and management. Information technology (IT) is any computer-based tool that people use to work with information and support the information-processing needs of an organization, such as a PC, a bar code scanner or a biometric fingerprint reader.
The relationship is that IT is the set of tools, while MIS is about how those tools are planned, developed, managed and used. MIS brings together three key resources, information, people and technology, so that they work together to create a competitive advantage. IT is therefore one part of MIS, and it is only valuable when people use it to work with information.`},

{id:"c1-bi",ch:1,kind:"question",lp:1,title:"Business intelligence",
prompt:"What is business intelligence (BI)? Explain how it helps an organization.",
text:`Business intelligence (BI) is knowledge about your customers, your competitors, your business partners, your competitive environment and your own internal operations. It combines different forms of information to create real knowledge, it encompasses everything that affects your business, and it helps the organization make effective, important and often strategic business decisions.
A BI system is the IT that supports the business intelligence function. It helps managers understand the capabilities of the firm, the state of the art, trends and future directions in the market, the external environment affecting competition, and the actions of competitors. For example, a supermarket can combine its sales data with competitor prices and seasonal trends to decide which products to promote, which gives it an advantage over rivals who only look at their own sales figures.`},

{id:"c1-dims",ch:1,kind:"note",title:"Personal and organizational dimensions of information",
text:`Data is raw facts. Information is data that has a particular meaning within a specific context, such as weather information when deciding what to wear.
The personal dimensions of information are:
• Time: having access to information when you need it, and information that describes the right time period.
• Location: access to information no matter where you are, for example through an intranet.
• Form: information in a form that is usable, understandable and free of errors.
The organizational dimensions describe information that is:
• Internal: about the operational aspects of the organization.
• External: about the environment surrounding the organization.
• Objective: quantifies something that is known.
• Subjective: attempts to describe something that is unknown.`},

{id:"c1-techlit",ch:1,kind:"question",lp:3,title:"Technology-literate employees: good and bad",
prompt:"HR plays an important role in any organization. Tell me about technology-literate employees. What are the good and bad sides of hiring them? Give reasons.",
text:`A technology-literate knowledge worker is a person who knows how and when to apply technology. This is different from an information-literate knowledge worker, who can define what information is needed, knows how and where to obtain it, understands it and acts appropriately based on it. HR plays an important role because it decides who to hire and how to train them, so it shapes how well the whole organization can use its information systems.
The good side is that technology-literate employees need less training, so they become productive faster and save the company training costs. They adapt quickly to new systems, can solve small technical problems on their own, and can use tools such as email, intranets and databases to share information and support decisions. This helps the organization stay competitive.
The bad side is that being good with technology does not mean being good with information. A technology-literate employee may still make poor decisions if they are not information-literate. They may expect higher salaries, may rely too much on technology for tasks that need human judgement, and may misuse their skills, for example accessing data they should not see. For these reasons HR should look for employees who are both technology-literate and information-literate, and who act ethically.`},

{id:"c1-ubiq",ch:1,kind:"question",lp:4,title:"Ubiquitous computing",
prompt:"What is ubiquitous computing? Explain how it works in an organization.",
text:`Ubiquitous computing is the concept that technology support is available anytime and anywhere, with access to any needed information. Instead of computing being tied to one machine in one office, it is spread throughout the organization and everyday life.
It works through three ideas. Decentralized computing distributes computing power within the organization to the knowledge workers who need it, rather than keeping it in one central computer. Shared information allows anyone in the organization to access the information they need, when they need it. Mobile computing uses wireless technology to connect people to the resources and information they need wherever they are. An example of mobile computing is m-commerce, which is electronic commerce conducted wirelessly, such as paying with a phone or booking a ticket from a mobile app.`},

{id:"c1-knowledge",ch:1,kind:"question",title:"Knowledge worker vs skilled worker",
prompt:"From your own understanding, differentiate a 'knowledge worker' and a 'skilled worker'.",
text:`A knowledge worker is a person who works with and produces information as a product. We live in the information age, a time when knowledge is power, and knowledge workers now outnumber all other workers by at least four to one. Examples are managers, analysts, accountants and teachers, whose main output is information, decisions or ideas.
A skilled worker is a person whose value comes mainly from practical, physical or manual skills learned through training and experience, such as an electrician, a mechanic or a welder. Their output is usually a physical product or service rather than information. The main difference is that a knowledge worker thinks and works with information, while a skilled worker works with their hands and tools. In a modern organization the two overlap, because skilled workers increasingly use technology and information to do their jobs.`},

{id:"c1-hwsw",ch:1,kind:"note",title:"Hardware and software categories",
text:`IT has two categories: hardware and software.
Hardware is the physical devices of a computer:
• Input device: enters information and commands, e.g. mouse, bar code scanner.
• Output device: shows the results, e.g. monitor, printer.
• Storage device: stores information, e.g. DVD, flash memory.
• CPU: interprets and executes software instructions. RAM temporarily holds information and software.
• Telecommunications device: sends and receives information in a network, e.g. modem.
• Connecting device: connects pieces of hardware, e.g. cable, port.
Software is the set of instructions that the hardware runs:
• Application software solves specific problems or performs specific tasks, e.g. Word, payroll.
• System software handles technology management tasks and coordinates all hardware. Its two types are operating system software, which controls application software and manages hardware, and utility software, which adds functionality to the operating system, e.g. anti-virus software.`},

{id:"c1-topline",ch:1,kind:"note",title:"Top line vs bottom line; run, grow, transform",
text:`Competitive advantage means providing a product or service that customers value more than the competition. IT use must support the business vision, and IT strategy must be integrated with it.
• Top line: competitive advantage focused on increasing revenue.
• Bottom line: competitive advantage focused on decreasing costs.
IT can support both. A customer self-service system puts technology in the customers' hands so they can process their own transactions. ATMs attract new customers through free use (top line) and reduce the cost of tellers (bottom line).
Run, grow, transform is a framework for allocating IT spending:
• Run: optimizing the execution of activities (bottom line).
• Grow: increasing market reach and product offerings (top line).
• Transform: innovating business processes.`},

{id:"c1-systems",ch:1,kind:"note",title:"TPS, OLTP, OLAP, EIS and other IT support",
text:`• Transaction processing system (TPS): processes transactions that occur within an organization.
• Database: stores tremendous detail on every transaction or event. A DBMS is the software bridge between the information and the people or software that use it.
• Online transaction processing (OLTP): gathering, processing and updating information for a transaction.
• Online analytical processing (OLAP): manipulating information to support decision making.
• Executive information system (EIS): supports "drilling down" into information to find problems and opportunities.
• Collaboration system: improves team performance by supporting the sharing and flow of information.
• Artificial intelligence (AI): the science of imitating human thinking and behavior.
• Supply chain management (SCM): tracks inventory and information.
• Electronic data interchange (EDI): computer-to-computer transfer of information without human intervention. It is a bottom-line initiative to reduce the cost of ordering, shipping and paying.`},

{id:"c1-security",ch:1,kind:"note",title:"Ethics, spyware and identity theft",
text:`Ethics are the principles and standards that guide our behavior toward other people. Ethics and laws are different: laws require or prohibit an action, while ethics is a matter of personal interpretation.
• Spyware is software that collects information about you and your computer and sends it to someone else.
• Identity theft is forging someone's identity for the purpose of fraud.
To protect yourself:
• Keep anti-virus software up to date.
• Use only secure websites for financial transactions.
• Never give out personal information on the Web.
• Change your password frequently.
• Never assume high ethical standards of other people.`},

{id:"c1-commute",ch:1,kind:"question",lp:5,title:"E-commuting vs telecommuting",
prompt:"Explain the difference between e-commuters and telecommuters. Give the positives and drawbacks, and explain why you chose them.",
text:`Telecommuting is the use of communication technologies such as the phone, email and the internet to work outside the office, usually at home, for some or all of the working week. A telecommuter may still travel to the office on some days. E-commuting is a form of telecommuting in which the employee does the work fully electronically from a remote location, so the daily journey to the office is replaced by an electronic connection to the company network.
The positives are that employees save travel time and cost, which improves their work-life balance and productivity. The company saves on office space and can hire talented people who live far away. There is also less traffic and pollution. I chose these because they benefit the employee, the company and society at the same time.
The drawbacks are that employees can feel isolated and miss face-to-face teamwork. It is harder for managers to supervise and measure performance, and the boundary between work and family life is eroded. Company data is also less secure on home networks. I chose these because they are the main risks an organization must manage before allowing remote work.`},

/* ---------- CH 2 ---------- */
{id:"c2-initiatives",ch:2,kind:"note",title:"Business initiatives that need IT",
text:`Businesses must be innovative to stay in business and succeed. IT is a powerful tool, but it must be used within the business strategy.
The major business initiatives that need IT are:
• Customer relationship management (CRM)
• Supply chain management (SCM)
• Business intelligence (BI)
• Integrated collaboration environments (ICE)`},

{id:"c2-fiveforces",ch:2,kind:"drawing",diagram:"fiveforces",title:"Porter's Five Forces Model",
prompt:"Using Porter's Five Forces Model, describe the five forces with an example company.",
text:`The Five Forces Model helps determine the relative attractiveness of an industry. Its five forces are:
1. Buyer power: high when buyers have many choices and low when they have few. IT can reduce buyer power through loyalty programs, such as airline frequent flyer schemes.
2. Supplier power: high when buyers have few choices and low when they have many. It is the opposite of buyer power.
3. Threat of substitute products or services: high when there are many alternatives. Switching costs make customers reluctant to switch.
4. Threat of new entrants: high when it is easy for new competitors to start. An entry barrier, such as ATMs and online banking, is a feature customers want that new competitors must provide.
5. Rivalry among existing competitors: high in a fiercely competitive market, such as retail grocers who use IT to compete on price.
For example, Apple faces low buyer power because its products are unique, and a low threat of new entrants because it constantly differentiates its products through research and development.`},

{id:"c2-valuechain",ch:2,kind:"drawing",lp:6,diagram:"valuechain",title:"Value chain: increasing value",
prompt:"What is a value chain? Explain how an organization can use it and IT to increase value, marketing and sales.",
text:`A value chain views the organization as a chain, or series, of processes, each of which either adds value to or reduces value from the product or service. A business process is a set of activities that accomplishes a specific task, such as order processing or a sales transaction. The primary value processes are receiving and storing raw materials, making the product or service, delivering it, marketing and selling it, and providing service after the sale. The support value processes are management, accounting, finance and legal, human resource management, research and development, and purchasing.
To increase value, the organization gathers quantifiable information from its customers, for example through surveys, to identify which processes add value and which reduce it. It then uses IT to strengthen the value-added processes and fix the value-reducing ones. For example, Talbott, a necktie maker, found that customers valued its high quality manufacturing and materials, but that items being out of stock reduced value. It used IT to give its sales force timely stock information. In the same way, a firm can use a CRM system to target marketing campaigns, sales force automation to close more sales, and better after-sales service to keep customers coming back, which increases sales and the value delivered.`},

{id:"c2-scm",ch:2,kind:"drawing",lp:9,diagram:"scm",title:"Supply chain management and inventory",
prompt:"What is supply chain management (SCM)? Explain how companies such as Dell manage their inventory.",
text:`Supply chain management (SCM) tracks inventory and information among business processes and across companies. An SCM system is the IT that supports supply chain management. A distribution chain is the path followed by a product or service as it moves from the supplier to the customer.
A typical computer retailer follows a "buy, hold and sell" model. It buys stock in advance and holds a high level of inventory until it is sold, which ties up money and risks the stock becoming outdated. Dell is famous for its "sell, source and ship" model. It first sells the computer to the customer by internet or phone, then sources the parts from suppliers, who supply on demand every two hours, then manufactures, stores and merges the order and ships it. Because selling and sourcing happen throughout the time, Dell keeps its inventory low.
SCM manages inventory using just-in-time (JIT), which provides the product or service just when it is needed. Other SCM goals are fulfillment, which means the right quantity of parts at the right time, logistics, which keeps transportation costs low, and production, which keeps production lines running smoothly. Inter-modal transportation uses multiple channels such as trucks and boats.`},

{id:"c2-crm",ch:2,kind:"note",title:"Customer relationship management (CRM)",
text:`A CRM system uses information about customers to gain insight into their needs, wants and behaviors in order to serve them better.
Its main parts are:
• Sales force automation (SFA): tracks all the steps in the sales process.
• Customer service and support.
• Marketing campaign management.
SCM software was first provided by specialist companies such as i2 and Manugistics, and is now dominated by enterprise software providers such as SAP, Oracle and PeopleSoft.`},

{id:"c2-ice",ch:2,kind:"question",lp:10,title:"Integrated collaboration environment (ICE)",
prompt:"Research on Integrated Collaboration Environment (ICE). What is it all about and how does it work?",
text:`An integrated collaboration environment (ICE) is the environment in which virtual teams do their work. A virtual team is a team whose members are located in different geographical locations, so they cannot easily meet face to face. An ICE starts with simple tools such as email and becomes more advanced as the team needs more support.
It works by combining several systems. A collaboration system such as video conferencing lets members meet and share information. A workflow system automates the business process by defining the steps, from beginning to end, that the work must pass through, so each member knows what to do next. A document management system stores and shares the team's files, and peer-to-peer tools let members share directly. A knowledge management system captures, organizes and spreads the team's know-how, so that people do not reinvent the wheel. A social network system links you to the people you know and the people they know, which works like a referral service. Together these let a team spread across the world work as if it were in one office.`},

{id:"c2-changes",ch:2,kind:"note",title:"Three worldwide changes in the business environment",
text:`• Emergence of the global economy: firms depend more on imports and exports, and information systems provide the communication and analytic power to trade and manage on a global scale. Globalization brings new threats to local businesses.
• Transformation of industrial economies: leading economies are becoming knowledge- and information-based service economies, and knowledge is used more intensely in traditional products.
• Transformation of the business enterprise: the traditional firm is hierarchical, centralized and structured, with rigid division of labor. The new style is decentralized and flexible, with generalists, mass customization, informal commitments, flexible teams and a customer orientation.`},

{id:"c2-isdef",ch:2,kind:"note",title:"What is an information system?",
text:`An information system is a set of interrelated components that collect, process, store and distribute information to support decision making and control in an organization. The three activities that produce information are input, processing and output.
From a business perspective, an information system is an organizational and management solution, based on IT, to a challenge posed by the environment. It has three dimensions:
• Organization: people, structure, operating procedures, politics and culture.
• Management: managers perceive challenges, set strategy and allocate resources.
• Technology: IT is the tool managers use to cope with change.
There are two contemporary approaches to studying IS:
• Technical approach: mathematical, normative models, using computer science, management science and operations research.
• Behavioral approach: issues such as integration, design and use, studied through psychology, economics and sociology.`},

{id:"c2-networked",ch:2,kind:"note",title:"The networked enterprise",
text:`Growing computing power and networks are turning organizations into networked enterprises. This allows them to:
• Flatten organizations: fewer levels of management, with lower-level employees given more decision-making authority and managers given a wider span of control.
• Separate work from location: organize globally while working locally, work remotely and form virtual organizations.
• Reorganize work flows: electronic work flows replace paper and manual routines, cutting costs.
• Increase flexibility: small firms gain the power of large ones, and large firms achieve mass customization.
• Change the management process: IT helps managers plan, organize, lead and control, for example through ERP.
• Redefine organizational boundaries: interorganizational systems link a company to its customers, distributors and suppliers.
An electronic market is an information system that links buyers and sellers to exchange information, products, services and payments.`},

/* ---------- CH 3 ---------- */
{id:"c3-org",ch:3,kind:"note",title:"What is an organization?",
text:`Technical definition: an organization is a stable, formal social structure that takes resources from the environment and processes them to produce outputs.
Behavioral definition: an organization is a collection of rights, privileges, obligations and responsibilities that is delicately balanced over a period of time through conflict and conflict resolution.
Common features of organizations:
• Formal structure
• Standard operating procedures
• Politics
• Culture
Types of organizational structure:
• Entrepreneurial: a startup business.
• Machine bureaucracy: a mid-sized manufacturing firm.
• Divisionalized bureaucracy: a Fortune 500 company.
• Professional bureaucracy: law firms and hospitals.
• Adhocracy: a consulting firm.`},

{id:"c3-roles",ch:3,kind:"note",title:"Roles in the IS department",
text:`• Programmers write the software.
• Systems analysts translate business problems into information system solutions.
• IS managers are the leaders of the IS department.
• End users are the representatives of the departments for whom the applications are developed.`},

{id:"c3-theories",ch:3,kind:"note",title:"Economic and behavioral theories of IS",
text:`• Microeconomic model: information technology is a factor of production, like capital and labor.
• Transaction cost theory: firms try to minimize transaction costs, both internally and externally.
• Agency theory: the firm is a nexus of contracts among self-interested parties who require supervision.
• Behavioral theories: information systems could change the hierarchy of decision making, reduce the need for middle management and clerical support, and distribute information more widely.`},

{id:"c3-hr",ch:3,kind:"question",lp:3,title:"How IS supports HR",
prompt:"HR plays an important role in any organization. Explain how information systems help the human resources function.",
text:`Human resources is responsible for recruiting, training, paying and developing the people in an organization, and people are one of the three key resources of any information system. A human resources information system (HRIS) manages one or more of these human resources functions, and an employee relationship management system manages communication between employees and the business.
Information systems help HR in several ways. HR can use email to communicate with all staff at once. It can publish the employee handbook electronically on the intranet and revise it instantly instead of reprinting it. It can run interactive training classes online, so employees learn at their own pace. Employees can also review and update their own personal data, which reduces HR's paperwork and errors. As a result, HR becomes faster and cheaper, and employees get better service.`},

{id:"c3-simon",ch:3,kind:"drawing",lp:12,diagram:"simon",title:"Simon's stages of decision making",
prompt:"Describe the stages of decision making according to Simon.",
text:`According to Herbert Simon, decision making has four stages:
1. Intelligence: collect information and identify the problem.
2. Design: conceive the possible alternatives and select the criteria.
3. Choice: use the criteria to evaluate the alternatives and select one.
4. Implementation: put the decision into effect, allocate the resources and control the results.
If the implementation does not solve the problem, the manager goes back to an earlier stage.
Managers can be described in two ways. The classical view describes their functions: plan, organize, coordinate, decide and control. The behavioral view is based on observations of what managers actually do on the job.`},

{id:"c3-strategy",ch:3,kind:"note",title:"IS and business strategy",
text:`Information systems can help a firm compete by:
• Locking in customers and suppliers.
• Supply chain management: stockless inventories, continuous replenishment and just-in-time delivery.
• Intrafirm strategy: product differentiation, focused differentiation, or being the low-cost producer.
• Efficient customer response: point-of-sale systems and data mining.`},

/* ---------- CH 4 ---------- */
{id:"c4-useful",ch:4,kind:"note",title:"Data vs information, and what makes it useful",
text:`Data is raw facts and observations. Information is data made useful for decision making, and it drives the management functions.
Useful information is:
• Timely
• High quality
• Complete
• Relevant
• Understandable
Organizations exchange information with the external environment by gathering intelligence information and providing public information. Within the organization, information flows up, down, around and across to facilitate decision making and problem solving.`},

{id:"c4-concepts",ch:4,kind:"note",title:"MIS, DSS, GDSS, AI and expert systems",
text:`• Information system: uses the latest IT to collect, organize and distribute data for use in decision making.
• Management information system (MIS): designed to meet the information needs of managers in daily decision making.
• Decision support system (DSS): an interactive system that lets users organize and analyze data to solve complex and sometimes unstructured problems.
• Group decision support system (GDSS): helps groups solve complex, unstructured problems, using groupware.
• Artificial intelligence (AI): computer systems with the capacity to reason the way people do.
• Expert system (ES): software that uses AI to mimic the thinking of human experts.
IT gives managers planning advantages, such as better and more timely access to information and involving more people in planning, and organizing advantages, such as better communication, coordination and integration.`},

{id:"c4-nerve",ch:4,kind:"drawing",lp:11,diagram:"nerve",title:"The manager as an information-processing nerve center",
prompt:"Research on the information processing nerve center. What is it all about and how does it work?",
text:`The information-processing nerve center describes the manager as the center of an organization's information flows, like the nerve center of a body. Just as the brain receives signals from every part of the body, processes them and sends out instructions, a manager receives information from inside and outside the organization, processes it, and passes it on as decisions and instructions.
It works through the manager's three sets of roles. In the informational roles, information is sought, received and transferred among insiders and outsiders. In the interpersonal roles, information is used for ceremonies, motivation and networking. In the decisional roles, information is used for entrepreneurship, resource allocation, disturbance handling and negotiation. All of this information supports the four management functions at the center: planning, organizing, leading and controlling. To do this well, the manager needs three inputs: information technology, computer literacy and information competency. Without them, the nerve center cannot process information quickly enough to make good decisions.`},

{id:"c4-prog",ch:4,kind:"question",lp:7,title:"Programmed vs non-programmed decisions",
prompt:"Explain the difference between programmed and non-programmed decisions. A supermarket manager reorders milk every time stock falls below 50 cartons. Which type of decision is this, and why?",
text:`A programmed decision applies a solution that is already available from past experience to solve a structured problem. Structured problems are familiar, straightforward and clear in their information needs, so programmed decisions suit routine problems that can be anticipated. A non-programmed decision develops a novel solution for a unique situation that presents an unstructured problem, one that is full of ambiguities and information deficiencies. These decisions are commonly faced by higher-level management.
Reordering milk whenever stock falls below 50 cartons is a programmed decision. The problem is routine and happens regularly, the rule is already known from past experience, and the manager does not need to create a new solution each time.`},

{id:"c4-crisis",ch:4,kind:"note",title:"Crisis decision making",
text:`A crisis is an unexpected problem that can lead to disaster if it is not resolved quickly and appropriately.
The rules for crisis management are:
• Figure out what is going on.
• Remember that speed matters.
• Remember that slow counts, too.
• Respect the danger of the unfamiliar.
• Value the skeptic.
• Be ready to "fight fire with fire."`},

{id:"c4-env",ch:4,kind:"note",title:"Decision environments",
text:`There are three decision environments:
• Certain environment: complete information about the action alternatives and their outcomes.
• Risk environment: incomplete information, but the probabilities of outcomes can be estimated.
• Uncertain environment: information is so poor that probabilities cannot be assigned to outcomes.
As the environment moves from certain to uncertain, the risk of failure rises from low to high, and decisions move from programmed to non-programmed.`},

{id:"c4-styles",ch:4,kind:"note",title:"Problem-solving styles and thinking",
text:`• Problem avoiders are inactive in gathering information and solving problems.
• Problem solvers are reactive in gathering information and solving problems.
• Problem seekers are proactive in anticipating problems and opportunities, and take action to gain an advantage.
• Systematic thinking approaches problems in a rational, step-by-step and analytical way.
• Intuitive thinking approaches problems in a flexible and spontaneous way.
• Multidimensional thinking applies both, and requires skill at strategic opportunism.`},

{id:"c4-steps",ch:4,kind:"drawing",lp:8,diagram:"decision5",title:"Steps in managerial decision making and problem solving",
prompt:"Draw the steps in managerial decision making and problem solving, and briefly explain each step.",
text:`The managerial decision-making process has five steps:
1. Identify and define the problem. Gather and process information and set the decision objectives. Avoid defining the problem too broadly or narrowly, focusing on symptoms instead of causes, or choosing the wrong problem.
2. Generate and evaluate alternative solutions using stakeholder analysis and cost-benefit analysis, judged on benefits, costs, timeliness, acceptability and ethical soundness.
3. Make the decision and conduct the ethics double check.
4. Implement the decision and avoid the lack-of-participation error.
5. Evaluate results by comparing actual and desired results.
The process is repeated as necessary: if results fall short, the manager returns to earlier steps.`},

{id:"c4-models",ch:4,kind:"note",title:"Classical vs behavioral decision model",
text:`• Classical decision model: managers act rationally in a certain world. They face clearly defined problems and have complete knowledge of all alternatives and their consequences. This results in an optimizing decision.
• Behavioral decision model: managers act on what they perceive about a situation. It recognizes cognitive limitations and bounded rationality in human information processing. This results in a satisficing decision.`},

/* ---------- CH 5 ---------- */
{id:"c5-ethics",ch:5,kind:"note",title:"Ethics and the technology trends that raise ethical issues",
text:`Ethics are the principles of right and wrong that individuals, acting as free moral agents, use to make choices to guide their behavior. Information systems raise new ethical questions because they create opportunities for intense social change. Ethical, social and political issues are closely linked, and new technology has a ripple effect on all three.
The four key technology trends that raise ethical issues are:
• Computing power doubles every 18 months, increasing reliance on and vulnerability to computer systems.
• Data storage costs are rapidly declining, multiplying databases on individuals.
• Data analysis advances make it easier to find detailed personal information, through profiling and nonobvious relationship awareness (NORA).
• Networking advances and the Internet enable moving and accessing large quantities of personal data.`},

{id:"c5-concepts",ch:5,kind:"note",title:"Responsibility, accountability, liability, due process",
text:`• Responsibility: accepting the potential costs, duties and obligations of one's decisions.
• Accountability: mechanisms are in place to determine who took action and who is responsible for it.
• Liability: laws that permit individuals to recover the damages done to them by other actors, systems or organizations.
• Due process: laws are known and understood by all, and individuals can appeal to higher authorities to ensure the laws were properly applied.`},

{id:"c5-analysis",ch:5,kind:"note",title:"Ethical analysis and candidate ethical principles",
text:`The five-step ethical analysis:
1. Identify the facts.
2. Define the conflict or dilemma and identify the values involved.
3. Identify the stakeholders.
4. Identify the options that can be taken.
5. Identify the potential consequences of the actions.
Candidate ethical principles:
• Kant's Categorical Imperative: if an action is not right for everyone to take, it is not right for anyone.
• Descartes' rule of change: if an action cannot be taken repeatedly, it should not be taken at any time.
• Utilitarian Principle: take the action that achieves the higher or greater value.
• Risk Aversion Principle: take the action that produces the least harm or least cost.
• Ethical "no free lunch" rule: all tangible and intangible objects are owned by someone else unless declared otherwise.
• Religious beliefs can also guide ethical decisions.`},

{id:"c5-moral",ch:5,kind:"note",title:"Five moral dimensions of the information age",
text:`Ethical, social and political are the levels of analysis for each of the five moral dimensions:
• Information rights and obligations
• Property rights and obligations
• Accountability and control
• System quality
• Quality of life
Websites can learn who their visitors are when they register, or without their knowledge using cookies. Cookies are tiny files deposited on a computer's hard drive that track visits to a website. Web bugs are tiny graphic files embedded in email and web pages to monitor who is reading them.`},

{id:"c5-ip",ch:5,kind:"question",title:"Intellectual property: trade secret, copyright, patent",
prompt:"What is intellectual property? Explain how trade secret, copyright and patent law protect it.",
text:`Intellectual property is the intangible property created by individuals or corporations that is protected under trade secret, copyright and patent law.
A trade secret is an intellectual work product used for a business purpose that belongs to that business, provided it is not based on information in the public domain. Trade secret law protects the actual ideas in a work product, not only how they are expressed. However, with software it is hard to stop the ideas from becoming public when the software is widely distributed. Copyright is a statutory grant that protects creators against copying by others for the life of the author plus 70 years, or 95 years for corporate copyrights. It protects against copying all or part of a program, but not the ideas behind it, so a competitor can build software that follows the same concepts. A patent grants the owner an exclusive monopoly on the ideas behind an invention for 20 years. Its key concepts are originality, novelty and invention, and the difficulty is passing these strict criteria. Digital media is so easy to copy and share over the Internet that all three are hard to enforce.`},

{id:"c5-social",ch:5,kind:"note",title:"Negative social impacts of IS",
text:`• Job loss: redesigning business processes could cause millions of middle managers and clerical workers to lose their jobs.
• Dependence and vulnerability: organizations become vulnerable to disasters, power outages, computer crime and viruses.
• Boundaries: the "do anything anywhere" environment erodes the boundary between work and family life.
• Computer crime is committing illegal acts through the use of a computer. Computer abuse is committing acts that may not be illegal but are unethical. Both are mainly committed by insiders.
• Spam is unrequested junk email sent to thousands of Internet users.
• Digital divide: information, knowledge and computer access are unequally distributed among social classes.
• Repetitive stress injury (RSI): the largest source is computer keyboards.
• Computer vision syndrome (CVS): eyestrain related to display screens.
• Technostress: stress induced by computer use, with symptoms such as aggravation, hostility, impatience and fatigue.`},

/* ---------- CH 6 ---------- */
{id:"c6-hierarchy",ch:6,kind:"drawing",diagram:"datahier",title:"The data hierarchy",
prompt:"Describe the data hierarchy, from bit to database.",
text:`The data hierarchy is:
1. Bit: a binary digit, 0 or 1.
2. Byte: a combination of bits that represents a character.
3. Field: a collection of bytes that represents a datum or fact.
4. Record: a collection of fields that reflects a transaction.
5. File: a collection of similar records.
6. Database: an organization's electronic library of files, organized to serve business applications.
An entity is a person, place, thing or event about which data must be kept. An attribute is a description of a particular entity. A key field is the field in each record that uniquely identifies it, used for retrieving, updating and sorting.`},

{id:"c6-files",ch:6,kind:"note",title:"Problems of the traditional file environment",
text:`• Data redundancy
• Program and data dependency
• Lack of flexibility
• Poor security
• Lack of data sharing and availability
File access methods:
• Sequential: tape oriented. One record follows another in physical sequence.
• Direct: disk oriented. Records can be accessed without regard to physical sequence. Each record has a key field, which is fed into a transform algorithm that generates the physical storage location (record address).`},

{id:"c6-dbms",ch:6,kind:"note",title:"DBMS, views and database models",
text:`A database management system (DBMS) is software that creates and maintains data and enables business applications to extract it, independent of specific computer programs.
Its three components are:
• Data definition language: defines the data elements in the database.
• Data manipulation language: manipulates the data for applications.
• Data dictionary: the formal definitions of all variables in the database.
Two views of data:
• Physical view: where the data physically is, such as drive, disk, track and sector.
• Logical view: what data the application needs, such as the name, type and length of each field.
Database models:
• Hierarchical: a tree with a root and child records, for one-to-many relationships.
• Network: a variation of the hierarchical model, useful for many-to-many relationships.
Normalization is the process of creating small, stable data structures from complex groups of data.`},

{id:"c6-warehouse",ch:6,kind:"note",title:"Data warehouse, data mart, data mining, web databases",
text:`• Data mart: a small data warehouse for a special function, such as focused marketing based on customer information.
• Data mining: tools for finding hidden patterns and relationships, and predicting trends.
• Linking a database to the Web: the web user connects to the vendor's database, special software converts HTML requests to SQL, SQL finds the data, and the server converts the result back to HTML.`},

{id:"c6-tangible",ch:6,kind:"question",lp:15,title:"Tangible and intangible benefits",
prompt:"Explain the difference between tangible and intangible benefits of an information system, with examples.",
text:`When an organization creates a database environment or any new information system, it faces cost and benefit considerations: there are large initial costs, and the benefits are often delayed. These benefits can be tangible or intangible.
Tangible benefits are benefits that can be measured and given a money value. Examples are reduced operating costs, fewer staff needed for clerical work, lower inventory costs and increased productivity. Because they can be measured, they are easy to use in a cost-benefit analysis. Intangible benefits are benefits that are real but difficult to measure in money. Examples are better decision making, improved customer service and satisfaction, better employee morale and a better company image. They are often the main reason a system is built, but they are harder to justify to management. In the same way, intellectual property is called intangible property because it has value but no physical form, while tangible objects are physical things that can be touched.`},

/* ---------- CH 7 ---------- */
{id:"c7-enterprise",ch:7,kind:"question",lp:19,title:"Enterprise computing; portal, intranet, extranet",
prompt:"What is enterprise computing? Explain the difference between a portal, an intranet and an extranet.",
text:`Enterprise computing is the use of computers in networks, such as LANs and WANs, or a series of interconnected networks that cover a variety of different operating systems, protocols and network architectures. It lets a large organization such as a retailer, manufacturer, government body or school share information across all of its departments and levels of management.
A portal is a collection of links, content and services presented on one web page that are useful for a particular job function. An intranet is a private network inside the company that uses internet technology, and only employees can access it. An extranet is the portion of the company's network that allows customers or suppliers to access parts of the enterprise's intranet. The internet, in contrast, is public and open to everyone.`},

{id:"c7-users",ch:7,kind:"note",title:"Enterprises, users and enterprise information",
text:`Types of enterprises include retail, manufacturing, service, wholesale, government, educational and transportation. Most traditional enterprises are organized in a hierarchy.
Users fall into four categories:
• Executive management
• Middle management
• Operational management
• Non-management employees
Managers coordinate resources by planning, organizing, leading and controlling.
Enterprise information is the information gathered in the ongoing operations of an enterprise. It supports business intelligence, business process management and business process automation.`},

{id:"c7-functional",ch:7,kind:"note",title:"Functional units and their systems",
text:`• Accounting and finance: accounting software manages everyday transactions, billing software reconciles purchases with payments, and financial software helps managers budget, forecast and analyze.
• Human resources: a human resources information system (HRIS) manages HR functions. Employee relationship management systems manage communication between employees and the business.
• Engineering: computer-aided design (CAD) aids engineering, drafting and design. Computer-aided engineering (CAE) tests product designs.
• Manufacturing: computer-aided manufacturing (CAM) controls production equipment. Computer-integrated manufacturing (CIM) integrates the many operations of manufacturing.
• Sales: sales force automation (SFA) equips travelling salespeople with electronic tools.
• Customer service: customer interaction management software manages day-to-day interactions with customers.
• IT department: makes technology decisions, such as whether to build or buy systems and when a system has outlived its useful life.`},

{id:"c7-gpis",ch:7,kind:"note",title:"General-purpose and integrated information systems",
text:`The five general-purpose information systems are:
• Office information system
• Transaction processing system
• Management information system
• Decision support system
• Expert system
Integrated information systems:
• Customer relationship management (CRM): manages information about customers, interactions, past purchases and interests.
• Enterprise resource planning (ERP): centralized, integrated software that helps manage and coordinate ongoing activities.
• Content management system: combines databases, software and procedures to manage documents and other content.
A data warehouse is a huge database that stores and manages the data required to analyze historical and current transactions.`},

{id:"c7-batch",ch:7,kind:"drawing",lp:17,diagram:"batch",title:"Batch processing vs OLTP",
prompt:"Explain the difference between batch processing and online transaction processing (OLTP). Analyze the diagram of an airline reservation to support your answer.",
text:`In batch processing, the computer collects data over a period of time and processes all the transactions later as a single group. In the diagram, a customer requests a reservation at 7:00 AM, but the request is added to a batch of reservations and stored. The whole batch is processed together at 10:00 PM, and only then are the confirmations printed. Batch processing is efficient for large volumes, but the information is not up to date until the batch is processed.
In online transaction processing (OLTP), the computer processes each transaction immediately as it is entered. In the diagram, the reservation requested at 7:00 AM goes straight to the OLTP reservation system and is confirmed at 7:01 AM. The customer gets an instant answer and the seat availability is always current, but the system must be available all the time.`},

{id:"c7-edi",ch:7,kind:"drawing",lp:18,diagram:"edi",title:"EDI: purchase order with and without EDI",
prompt:"What is Electronic Data Interchange (EDI)? Describe the difference when a company sends a purchase order (PO) with and without EDI.",
text:`Electronic Data Interchange (EDI) is a set of standards that controls the transfer of business data and information among computers within and among enterprises.
Without EDI, the buyer prepares the purchase order on paper or in a word processor, prints it and sends it by mail or fax. The supplier then has to re-key the order into its own system by hand. This is slow, costs paper and postage, and re-typing causes errors.
With EDI, the buyer's system generates the purchase order and translates it into a standard EDI format. It is sent electronically over a network straight to the supplier's computer, which reads and processes it automatically and sends back an acknowledgement. There is no re-typing, so the order is faster, cheaper and more accurate.`},

{id:"c7-hardware",ch:7,kind:"note",title:"Enterprise hardware and system qualities",
text:`Enterprise hardware lets large organizations manage and store data using devices built for heavy use, maximum availability and maximum efficiency.
• RAID duplicates data and implements duplication in different ways.
• A blade server packs a complete server on a single card, called a blade, which inserts into a blade server chassis.
• A thin client is a small terminal-like computer that relies mostly on a server for data storage and processing.
• A high-availability system keeps running at least 99 percent of the time, using hot-swapping and redundant components.
• Scalability is how well hardware, software or an information system can grow to meet increasing performance demands.
• Interoperability is the ability of an information system to share information with other systems in the enterprise.
• Continuous data protection provides automatic backup whenever data changes.`},

{id:"c7-network",ch:7,kind:"question",lp:14,title:"Core networking technologies in business",
prompt:"What are the core networking technologies used in business? Explain each briefly.",
text:`A network connects computers and devices so that a business can share information, hardware and software. The core networking technologies in business start with the local area network (LAN), which connects computers within one building or site, and the wide area network (WAN), which connects LANs across cities or countries. The Internet is the public network that links networks worldwide and is the foundation for e-commerce. Built on internet technology, an intranet is a private network for employees, and an extranet gives suppliers and customers access to parts of it. A virtual private network (VPN) creates a secure, encrypted connection over the Internet so remote staff can reach the company network safely.
Wireless technologies such as Wi-Fi, Bluetooth and cellular networks let employees work and pay from anywhere. Network hardware such as routers, switches and firewalls directs traffic and protects the network. Most business networks use a client/server design, in which servers store data and run services for client computers, and many firms now also use cloud computing to rent these services over the Internet. Together these technologies support communication, collaboration, EDI and enterprise systems such as ERP.`},

{id:"c7-generations",ch:7,kind:"question",lp:16,title:"Generations of mobile networks",
prompt:"Describe the differences between the generations of networks (1G to 5G).",
text:`1G, the first generation from the 1980s, was analog and supported voice calls only. Call quality was poor and calls were not secure. 2G, from the 1990s, was digital, for example GSM. It improved voice quality and security and introduced SMS text messages and very slow data. 3G, from the 2000s, brought mobile internet, so phones could browse the web, send email and make video calls. This made m-commerce and smartphones practical. 4G, from the 2010s, especially LTE, gave high-speed mobile broadband, so users could stream HD video, use cloud services and video conference on the move. 5G, from around 2019, offers much higher speeds, very low latency and the ability to connect huge numbers of devices at once. This supports the Internet of Things, smart factories and self-driving vehicles. Each generation is faster, carries more data and supports more business uses than the last.`},

{id:"c7-comm",ch:7,kind:"question",lp:13,title:"Mediums for communicating in business",
prompt:"Tell me some mediums or channels through which people can communicate with one another in business.",
text:`Businesses communicate through many electronic mediums. Email is the most common, because it is fast, cheap and keeps a written record. Instant messaging and chat tools such as Microsoft Teams or WhatsApp allow quick, informal conversations between team members. Video conferencing such as Zoom or LiveMeeting lets people in different locations meet face to face without travelling, which is important for virtual teams. Voice over IP (VoIP) makes phone calls over the Internet at low cost.
Inside the company, an intranet or portal publishes news, handbooks and forms to all employees, while groupware and collaboration systems let teams share documents, calendars and workflows. With partners, companies use extranets and EDI to exchange business documents such as purchase orders. Social network systems such as LinkedIn link employees with contacts and customers, and SMS and fax are still used for short notices. Choosing the right medium depends on how urgent, formal and private the message is.`},

/* ---------- CH 8 ---------- */
{id:"c8-plan",ch:8,kind:"note",title:"The information systems plan",
text:`The challenges in redesigning an organization are the risks and uncertainties in systems development. The direction of systems development covers the rationale, current situation, management strategy, implementation plan and budget.
The information systems plan has five parts:
1. Purpose of the plan: overview of contents, changes in the current situation, the firm's strategic plan, current organization and management strategy.
2. Strategic business plan: current situation, current organization, changing environment and major goals.
3. Current systems: major systems and capabilities (hardware, software, database, telecommunications), difficulties meeting requirements and anticipated future demands.
4. New developments: new system projects with business rationale, and new capabilities required.
5. Management strategy: acquisition plans, milestones and timing, organizational realignment, internal reorganization, management controls, training initiatives and personnel strategy.`},

{id:"c8-bsp",ch:8,kind:"note",title:"Enterprise analysis and paradigm shift",
text:`Enterprise analysis, or business systems planning (BSP), looks at organization-wide information needs in terms of organizational units, functions, processes and data elements. It helps identify the key entities and attributes in the organization's data.
A paradigm is a complete mental model of how a complex system functions. A paradigm shift involves rethinking the nature of the business and the organization: a complete reconception of how the system should function.`},

{id:"c8-bpr",ch:8,kind:"note",title:"How IT helps redesign business processes",
text:`• Analytical: brings complex analytical methods to bear on a process.
• Informational: makes vast amounts of detailed information available.
• Sequential: enables changes in the sequence of tasks, and parallel tasks.
• Knowledge management: allows capture and dissemination of knowledge and expertise.
• Tracking: allows detailed tracking of task status, inputs and outputs.
• Disintermediation: connects parties who would otherwise depend on an intermediary.`},

{id:"c8-sdlc",ch:8,kind:"drawing",diagram:"sdlc",title:"Systems development activities",
prompt:"List and explain the activities of systems development.",
text:`The systems development activities are:
1. Systems analysis: analysis of the problem to be solved with an information system, including a feasibility study and the information requirements.
2. Systems design: the specifications for output, input, user interface, database, controls and security.
3. Programming: translating the system needs into program code.
4. Testing: checking whether the system produces the desired results.
5. Conversion: changing from the old system to the new one.
6. Production and maintenance: running the system and making changes to it.`},

{id:"c8-feasibility",ch:8,kind:"note",title:"Feasibility study and design specifications",
text:`A feasibility study asks whether the problem can be solved within the constraints:
• Technical feasibility: is the hardware, software and technical resource available?
• Economic feasibility: will the benefits outweigh the costs?
• Operational feasibility: is the solution desirable within existing conditions?
Information requirements are a detailed statement of the new system's needs.
Design specifications cover:
• Output: medium, content, timing.
• Input: origins, flow, data entry.
• User interface: simplicity, efficiency, logic, feedback, errors.
• Database design: logical data relations, volume and speed, file organization, record specifications.
• Controls: input, processing, output, procedural.
• Security: access controls, catastrophe plans, audit trails.`},

{id:"c8-testing",ch:8,kind:"question",title:"Types of testing",
prompt:"Define unit testing, system testing, acceptance testing and the test plan in your own words.",
text:`Testing checks whether the system produces the desired results. Unit testing tests each program or unit separately, to make sure each small part works correctly on its own before it is combined with the others. System testing tests the whole system as one, to check that all the modules work together as planned. Acceptance testing is the final certification that the system is ready to be used, carried out by the users and management, who confirm it meets their requirements. A test plan is the preparation for all the tests that will be performed, listing what will be tested, the test data, the expected results and who is responsible.`},

/* ---------- CH 9 ---------- */
{id:"c9-lifecycle",ch:9,kind:"note",title:"Traditional systems lifecycle and its limitations",
text:`The systems lifecycle stages are:
1. Project definition: is there a problem, and can it be solved with a project?
2. Systems study: analyze problems in the existing system, define objectives and evaluate alternatives.
3. Design: logical and physical specifications for the system solution.
4. Programming: develop the software code.
5. Installation: testing, training and conversion.
6. Post-implementation: use and evaluate the system.
Its limitations are that it can be costly and time consuming, it may encourage freezing specifications early in development, and it may not suit small, less structured systems.`},

{id:"c9-proto",ch:9,kind:"drawing",diagram:"proto",title:"Prototyping",
prompt:"What is prototyping? Explain its steps.",
text:`Prototyping is the process of building an experimental system quickly to demonstrate and evaluate an approach, so that users can refine their needs. A prototype is a preliminary working version of an information system for demonstration and evaluation purposes.
The steps of prototyping are:
1. Identify the user's basic requirements.
2. Develop the initial prototype.
3. Use the prototype.
4. Revise and enhance the prototype, then repeat steps 3 and 4 until the user is satisfied.
Prototyping is best for designing the end-user interface, which is how the end user interacts with the system.`},

{id:"c9-package",ch:9,kind:"note",title:"Application software packages",
text:`An application software package is prewritten, precoded application software that is commercially available for sale or lease. It is geared to common requirements, such as payroll, accounts receivable or inventory control.
Customization is the modification of the software to meet the organization's needs, and the costs and benefits must be weighed.
A request for proposal (RFP) is a detailed list of questions submitted to vendors to find out whether their product meets the organization's requirements.
Systems development with a package:
• Systems analysis: identify the problem, user requirements, alternatives and vendors; choose package or in-house; evaluate and select the package.
• Systems design: tailor package features, train technical staff, prepare the physical design, customize the design and organizational procedures.
• Programming, testing and conversion: install the package, implement modifications, design program interfaces, document, convert and test.
• Production and maintenance: train users, correct problems, and install updates and enhancements.`},

{id:"c9-enduser",ch:9,kind:"note",title:"End-user development",
text:`End-user development means users build their own systems with fourth-generation tools.
Strengths:
• Increased productivity using query languages, graphics, report generators and application generators.
• Short development times.
Weaknesses:
• Relatively inefficient and slow transaction processing.
• May carry high cost.
• Large files can degrade performance.
• The nonprocedural approach may hamper logic and updating requirements.
An information center is a special facility within the organization that provides training and support for end-user computing.`},

{id:"c9-outsource",ch:9,kind:"question",title:"Outsourcing: advantages and disadvantages",
prompt:"What is outsourcing? Explain its advantages and disadvantages.",
text:`Outsourcing is contracting computer center operations, telecommunications networks or application development to external vendors, instead of doing the work in-house.
The advantages are economy, because the vendor's specialist services are often cheaper, and better service quality. Costs become more predictable, and the arrangement is flexible as the business grows or shrinks. Fixed costs become variable costs, because the firm pays only for what it uses. It also frees up human resources for other projects and frees up capital that would otherwise be spent on equipment.
The disadvantages are loss of control over the information systems function, and the vulnerability of strategic information, because confidential data is handled by outsiders. The firm also becomes dependent on the vendor, so if the vendor fails or raises its prices, the firm has few options.`},

/* ---------- CH 10 ---------- */
{id:"c10-need",ch:10,kind:"note",title:"The need for software quality assurance",
text:`• The Y2K problem showed the cost of poor software quality.
• Quality is more important than ever as software becomes an integral part of the products sold.
• Defining user needs and judging the quality of the completed system have proved to be major challenges.
• Meeting specifications does not necessarily mean quality, because many factors determine the success of a system.
Maintenance is the most expensive phase of the systems development process. Systems are maintained because of organizational changes, software complexity, and faulty systems analysis and design.`},

{id:"c10-quality",ch:10,kind:"note",title:"What is quality in IS?",
text:`Any definition of IS quality must be broad in scope and specific enough to cover the satisfaction of user needs. A quality system must:
• Achieve the business goals set by the user department.
• Operate at an acceptable cost, in line with the value produced for the firm.
• Meet carefully defined performance standards, such as response time and system availability.
• Produce accurate, reliable output that is "good enough" for its intended purpose.
• Be easy to learn and use.
• Be flexible.`},

{id:"c10-means",ch:10,kind:"note",title:"Means to ensure quality and resource allocation",
text:`The means to ensure quality are:
• Use of an appropriate systems development methodology.
• Proper resource allocation during development.
• Use of software metrics.
• Attention to testing.
• Use of quality tools.
Resource allocation is deciding how costs, time and personnel are assigned to the activities of a systems development project:
• 1/4 of the project's time and cost on specifications and analysis.
• 2/4 on design and programming.
• 1/4 on installation and post-implementation.`},

{id:"c10-methodology",ch:10,kind:"note",title:"The role of methodologies",
text:`A methodology is a collection of methods, one or more for every activity within every phase of a development project. It normally includes:
• Proven methods for determining and documenting system specifications and design.
• Programming standards that produce understandable, maintainable code that is not overly complex.
• Guidelines for quality measurements agreed by all parties before development.
• Standards and methods for testing the system.
• Software tools used at every phase to standardize work and improve output quality.
• Project control methods, including project milestones at which user approval is required.`},

{id:"c10-metrics",ch:10,kind:"note",title:"Software metrics",
text:`Software metrics are objective assessments of the software in a system, in the form of quantified measurements:
• Input metrics: the education and experience of the system developers.
• Capacity metrics: transaction levels.
• Output metrics: e.g. number of checks printed per hour.
• Performance or quality metrics: e.g. number of bugs per hundred lines of code.
• Value metrics: the business value of a transaction.`},

{id:"c10-structured",ch:10,kind:"note",title:"Structured analysis and data flow diagrams",
text:`Structured analysis is a top-down method for defining system inputs, processes and outputs, and for partitioning systems into subsystems or modules that show a logical graphic model of information flow.
A data flow diagram (DFD) is the primary tool of structured analysis. It shows a system's component processes and the flow of data between them. Its symbols are:
• Data flow: the movement of data between processes, external entities and data stores, drawn as an arrow.
• Process: the transformation of input data flows into output data flows, with a reference number and a verb-object name.
• Data store: a manual or automated inventory of data.
• External entity: an originator or receiver of information outside the scope of the system.
The limitations of traditional methods are that they are slow and unresponsive to fast-changing business, linear, costly because of the slowness, and process based rather than data based.`},

{id:"c10-oo",ch:10,kind:"note",title:"Object-oriented development, CASE and CMM",
text:`• Object-oriented software development de-emphasizes procedures and combines data and procedures to create objects. The system is a collection of classes and objects and their relationships, and objects are saved for reuse. It gives high reusability and low maintenance costs.
• Computer-aided software engineering (CASE) automates step-by-step methodologies to reduce repetitive work. It supports a standard methodology, improves communication between users and designers, organizes design components in a design repository, and automates tedious and error-prone analysis, design and code generation.
• The Capability Maturity Model (CMM) came from a US Department of Defense initiative to improve military software, aiming at cost reduction, schedule and quality improvement, assessment and evaluation, statistical control and measurement, and certification.
• The advantages of CMM are risk reduction, cost and schedule adherence, improved quality, and improved communication and customer satisfaction.`},

/* ---------- CH 11 ---------- */
{id:"c11-success",ch:11,kind:"note",title:"Measuring IS success and causes of failure",
text:`The measures of information system success are:
1. High levels of use
2. User satisfaction
3. Favorable attitudes
4. Achieved objectives
5. Financial payoff
The causes of information system success and failure are the implementation process, the level of complexity and risk, and the challenge of business reengineering.
The factors in implementation outcome are:
• Design, cost, operations and data
• User involvement and influence
• Management support
• Level of complexity and risk
• Management of the implementation process`},

{id:"c11-indicators",ch:11,kind:"note",title:"Actions and indicators for successful implementation",
text:`• Support by local funds
• New organizational arrangements
• Stable supply and maintenance
• New personnel classifications
• Changes in organizational authority
• Internalization of the training program
• Continual updating of the system
• Promotion of key personnel
• Survival of the system after turnover
• Attainment of widespread use`},

{id:"c11-km",ch:11,kind:"note",title:"Knowledge management systems",
text:`Knowledge management is the discipline that helps spread the knowledge of individuals or groups across the organization in ways that directly affect performance. It aims to get the right information, in the right context, to the right person, at the right time, for the right business purpose.
The types of knowledge management in the organization are:
• Office automation systems (OAS)
• Knowledge work systems (KWS)
• Group collaboration systems (GCS)
• Artificial intelligence applications (AI)`},

{id:"c11-kws",ch:11,kind:"question",title:"Knowledge work systems (KWS) and their benefits",
prompt:"What is a knowledge work system (KWS)? Explain its benefits.",
text:`A knowledge work system (KWS) is a methodology that optimizes human interfaces with the business process, a tool kit that integrates processes and software applications to execute work, and a mechanism to capture institutional knowledge, promote productivity and improve quality.
Its major benefits are improvements in efficiency, because the same work is done in less time, and improvements in effectiveness, through greater intellectual specialization. It improves focus, so more time is spent on the primary mission of the organization. It eliminates work by removing some tasks or doing them automatically, and it means less rework. For the organization, KWS facilitates collaboration among workgroups, reduces training requirements and realizes the productivity potential of technology. For managers, it supports intelligent work distribution, shows the graphical status of tasks and helps improve the business process. For employees, it streamlines job procedures, manages task schedules, automates repetitive, labor-intensive tasks and frees them to concentrate on challenging and creative work.`},
];

/* ======================= DIAGRAMS (theme-aware SVG) ======================= */
function svgBox(cx,cy,w,h,lines,cls=""){
  const lh=15, y0=cy-((lines.length-1)*lh)/2+4;
  return `<rect class="d-box ${cls}" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="4"/>`+
    lines.map((l,i)=>`<text class="d-txt" x="${cx}" y="${y0+i*lh}" text-anchor="middle">${l}</text>`).join("");
}
function clip(a,b){ // point on rect a's edge toward b
  const dx=b.x-a.x, dy=b.y-a.y, t=Math.min(dx?(a.w/2)/Math.abs(dx):1e9, dy?(a.h/2)/Math.abs(dy):1e9);
  return {x:a.x+dx*t, y:a.y+dy*t};
}
function svgArrow(a,b,id,dash){
  const p=clip(a,b), q=clip(b,a), dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy), g=5;
  return `<line class="d-arrow ${dash?"dash":""}" x1="${p.x+dx/L*2}" y1="${p.y+dy/L*2}" x2="${q.x-dx/L*g}" y2="${q.y-dy/L*g}" marker-end="url(#${id}${dash?"r":""})"/>`;
}
function defs(id){return `<defs>
<marker id="${id}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-mark" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="${id}r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-mark red" d="M0,0 L10,5 L0,10 z"/></marker></defs>`}

/* flow helper: a row of boxes joined by arrows, optional dashed loop back */
function flowG(id,items,y,o={}){
  const w=o.w||160,h=o.h||66,gap=o.gap||34,x0=o.x0||20;
  const R=items.map((l,i)=>({x:x0+w/2+i*(w+gap),y,w,h,l}));
  let s="";
  for(let i=0;i<R.length-1;i++) s+=svgArrow(R[i],R[i+1],id);
  if(o.loop){const a=R[R.length-1],b=R[o.loop.to||0],yy=y+h/2+26;
    s+=`<path class="d-arrow dash" d="M${a.x},${y+h/2} V${yy} H${b.x} V${y+h/2+6}" marker-end="url(#${id}r)"/>`;
    s+=`<text class="d-note" x="${(a.x+b.x)/2}" y="${yy+16}" text-anchor="middle">${o.loop.label}</text>`;}
  R.forEach((r,i)=>s+=svgBox(r.x,r.y,r.w,r.h,r.l,(o.alt||[]).includes(i)?"alt":""));
  return {s,width:x0*2+R.length*w+(R.length-1)*gap};
}
function flowSVG(id,label,items,o={}){
  const top=o.head?62:50, f=flowG(id,items,top,o), H=top+33+(o.loop?56:20)+(o.note?22:0);
  let s=`<svg viewBox="0 0 ${f.width} ${H}" role="img" aria-label="${label}">${defs(id)}`;
  if(o.head) s+=`<text class="d-head" x="20" y="20">${o.head}</text>`;
  s+=f.s;
  if(o.note) s+=`<text class="d-txt" x="20" y="${H-8}">${o.note}</text>`;
  return s+"</svg>";
}

function same(typed,target){
  if(typed===target) return true;
  if(target==="•") return typed==="-"||typed==="*";
  if(target==="’"||target==="‘") return typed==="'";
  if(target==="“"||target==="”") return typed==='"';
  if(target==="–"||target==="—") return typed==="-";
  return false;
}

function fmtText(t){
  const lines=t.split("\n"); let out="", list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  lines.forEach(l=>{
    let m;
    if((m=l.match(/^\s*•\s?(.*)$/))){ if(list!=="ul"){close();out+="<ul>";list="ul"} out+=`<li>${esc(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+\.\s(.*)$/))){ if(list!=="ol"){close();out+="<ol>";list="ol"} out+=`<li>${esc(m[1])}</li>`; }
    else { close(); if(l.trim()) out+=`<p>${esc(l)}</p>`; }
  }); close(); return out;
}

function openLightbox(key,i){
  const flat=DECKS.flatMap(d=>Array.from({length:d.n},(_,k)=>({d,i:k+1})));
  let pos=flat.findIndex(x=>x.d.key===key&&x.i===i);
  const box=document.createElement("div"); box.className="lightbox"; box.setAttribute("role","dialog"); box.setAttribute("aria-label","Slide viewer");
  document.body.appendChild(box); document.body.style.overflow="hidden";
  const show=()=>{const x=flat[pos];
    box.innerHTML=`<div class="lbbar"><span>Ch ${x.d.ch} · ${esc(x.d.label)} · page ${x.i} / ${x.d.n}</span><span class="spacer"></span>
      <button class="iconbtn" data-lb="prev" ${pos?"":"disabled"}>‹ Prev</button><button class="iconbtn" data-lb="next" ${pos<flat.length-1?"":"disabled"}>Next ›</button><button class="iconbtn" data-lb="close">✕ Close</button></div>
      <div class="lbimg"><img src="${slideSrc(x.d,x.i)}" alt="${esc(x.d.label)}, page ${x.i}"></div>`;
    box.querySelector('[data-lb="prev"]').onclick=()=>{if(pos>0){pos--;show()}};
    box.querySelector('[data-lb="next"]').onclick=()=>{if(pos<flat.length-1){pos++;show()}};
    box.querySelector('[data-lb="close"]').onclick=close;
  };
  const key_=ev=>{if(ev.key==="Escape")close();else if(ev.key==="ArrowRight"&&pos<flat.length-1){pos++;show()}else if(ev.key==="ArrowLeft"&&pos>0){pos--;show()}};
  function close(){document.removeEventListener("keydown",key_,true);box.remove();document.body.style.overflow="";}
  document.addEventListener("keydown",key_,true); box.onclick=ev=>{if(ev.target===box||ev.target.classList.contains("lbimg"))close()};
  show();
}

    app.innerHTML=`<div class="play">
      <div class="crumbs"><button id="qBack">← Quiz setup</button><span>${esc(meta.label)}</span><span style="margin-left:auto">Score ${R.score} / ${R.i}</span></div>
      <div class="qbar"><span style="width:${R.i/R.qs.length*100}%"></span></div>
      <div class="quiz">
        <div class="qhead"><span>Question ${R.i+1} of ${R.qs.length}</span><span>Ch ${q.ch} · ${esc(e.title)}</span></div>
        <h2>${esc(q.q)}</h2>
        <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ol">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="why" id="why" hidden></div>
        <div class="actions" id="qAct" hidden><button class="btn primary" id="qGo">${R.i===R.qs.length-1?"See results →":"Next question →"}</button></div>
      </div></div>`;
    $("#qBack").onclick=renderQuizSetup;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, right=i===q.a;
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a) x.classList.add("yes");});
      if(right) R.score++; else {b.classList.add("no"); R.missed.push(q);}
      const w=$("#why"); w.hidden=false; w.classList.toggle("bad",!right);
      w.innerHTML=`<b>${right?"Correct.":"Not quite."}</b> ${esc(q.why||"")}`;
      $("#qAct").hidden=false; $("#qGo").onclick=()=>{R.i++; R.i<R.qs.length?show():done();};
    });
    window.scrollTo(0,0);
  };
  const done=()=>{
    const pct=Math.round(R.score/R.qs.length*100), secs=(performance.now()-R.start)/1000;
    app.innerHTML=`<div class="play"><div class="result">
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><h2>Quiz complete</h2><span class="stamp">${pct>=80?"PASS":pct>=50?"ALMOST":"REVISE"}</span></div>
      <div class="rgrid"><div><span>Score</span><b class="pb">${R.score} / ${R.qs.length}</b></div><div><span>Percent</span><b>${pct}%</b></div><div><span>Time</span><b>${fmtTime(secs)}</b></div><div><span>Missed</span><b>${R.missed.length}</b></div></div>
      ${R.missed.length?`<div class="missed"><h3>Review what you missed</h3>${R.missed.map(q=>`<div class="mq"><p>${esc(q.q)}</p><p class="ans">✓ ${esc(q.o[q.a])}</p></div>`).join("")}</div>`:""}
      <div class="actions">${R.missed.length?`<button class="btn" id="qMissed">↺ Retry the ${R.missed.length} missed</button>`:""}<button class="btn" id="qAgain">↺ Same quiz, reshuffled</button><button class="btn primary" id="qNew">New quiz</button></div>
    </div></div>`;
    if($("#qMissed")) $("#qMissed").onclick=()=>startQuizRun(shuffle(R.missed).map(prepQ),{label:"Missed questions"});
    $("#qAgain").onclick=()=>startQuizRun(shuffle(R.qs).map(prepQ),meta);
    $("#qNew").onclick=renderQuizSetup;
    window.scrollTo(0,0);
  };
  show();
}

function openEntry(id,tab){

    <div class="crumbs"><button id="back">← Chapters</button><span>Ch ${e.ch} · ${esc(chName(e.ch))}</span><span class="tag ${e.kind==="question"?"q":e.kind==="drawing"?"d":""}">${kindLabel[e.kind]}</span>${e.lp?`<span class="tag lp">Lecturer pt ${e.lp}</span>`:""}<span style="margin-left:auto">${idx+1} / ${list.length}</span></div>

        <div class="eh"><span>ICE 2307 · Information System Management &amp; Security</span><span>Question ${idx+1} of ${list.length}</span></div>
        <div class="eq"><span class="qn">Q${idx+1}.</span>${esc(e.prompt)}</div>
        <div class="rules"><span>Full sentences</span><span>Bullets only if the question asks for a list</span><span>Diagrams in pen</span><span>Keep to one page</span></div>
      </div>`:`<h1 class="ptitle">${esc(e.title)}</h1>

      ${e.diagram?`<div class="seg" role="group" aria-label="Mode"><button data-tab="type" aria-pressed="${ui.tab==="type"}">Type the answer</button><button data-tab="draw" aria-pressed="${ui.tab==="draw"}">Draw the diagram</button></div>`:""}
      <span id="subcontrols" class="controls"></span>
